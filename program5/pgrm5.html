<head>

div { text-align:center; }

<body>
     <form><h1>REGISTRATION FORM</h1>

            <option>mrs.</option>
             <option>miss.</option></select>

     <br><br>

     <br><br>

     <label>Other</label>

     <input type="checkbox" name="language"required>
     <label>Malayalam</label>
     <input type="checkbox" name="language"required>
     <label>English</label>
     <input type="checkbox" name="language"required>
     <label>Hindi</label>

     <label for="course">Course</label>
     <select><option>MCA</option>
            <option>MBA</option>
             <option>B.TECH</option></select>   
     <br><br>
     <div>

     <input type="reset" value="RESET">
</div>
