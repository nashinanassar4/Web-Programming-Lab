<html>
<head>
<title>JS Validation</title>
</head>
<body>

<h2>FORM VALIDATION</h2>
<form name="form" onsubmit="return validateForm()">

<label>Name:</label>

<select name="init" id="init">
<option value="Mr">Mr</option>
<option value="Miss">Miss</option>
<option value="Mrs">Mrs</option>
</select>

<input type="text" id="fname" name="fname" placeholder="Enter Your Name">

<br><br>

<label>Phone:</label>
<select>
<option value="+91">+91</option>
<option value="+971">+971</option>
<option value="+966">+966</option>
</select>
<input type="tel" name="mob" id="mob" placeholder="Enter Your Phone No">

<br><br>

<label>Email:</label>
<input type="email" name="email" id="email" placeholder="Enter Your Email">

<br><br>

<label>Gender:</label>
<label>Female</label>
<input type="radio" name="gender" id="gender">
<label>Male</label>
<input type="radio" name="gender" id="gender">


<br><br>

<label>Language Known:</label>
<label>Malayalam</label>
<input type="checkbox" name="lang" id="malayalam">
<label>English</label>
<input type="checkbox" name="lang" id="english">
<label>Hindi</label>
<input type="checkbox" name="lang" id="hindi">

<br><br>

<label>Password:</label>
<input type="password" name="pass" id="pass" placeholder="Enter Your Password">

<br><br>

<label>Confirm Password:</label>
<input type="password" name="cpass" id="cpass" placeholder="Enter Your Password">

<br><br>

<button type="submit">Submit</button>

</form>

<script>

function validateForm()
{
 
 var fname=document.form.fname.value.trim();
 var mob=document.form.mob.value.trim();
 var email=document.form.email.value.trim();
 var gender=document.form.gender.value.trim();
 var lang=document.form.lang.value.trim();
 var pass=document.form.pass.value.trim();
 var cpass=document.form.cpass.value.trim();
 
 if (fname=="")
 {
  alert("Enter Name");
  document.form.fname.focus();
  return false;
 }
 else if(!/^[a-zA-Z\s]+$/.test(fname))
 {
  alert("Enter Valid Name");
  document.form.fname.focus();
  return false;
 }
 
 if (mob=="")
 {
  alert("Enter Phone Number");
  document.form.mob.focus();
  return false;
 }
 else if(!/^[0-9]{10}$/.test(mob))
 {
  alert("Enter Valid 10 Digit Phone Number");
  document.form.mob.focus();
  return false;
 }
 
 if (email=="")
 {
  alert("Enter Email");
  document.form.email.focus();
  return false;
 }
 else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))
 {
  alert("Enter Valid email");
  document.form.email.focus();
  return false;
 }
 
 if(!gender)
 {
  alert("Select gender");
  return False;
 }
 
 if(lang="")
 {
  alert("Select language");
  document.form.lang.focus();
  return False;
 }
 
 if (pass=="") 
 {
  alert("Enter Password");
  document.form.pass.focus();
  return false;
 }
 else if (pass.length<=6) 
 {
  alert("Password must be 6 characters long");
  document.form.pass.focus();
  return false;
 }
 
 
 if (cpass=="") 
 {
  alert("Enter Confirm Password");
  document.form.cpass.focus();
  return false;
 }
 else if(cpass!=pass)
 {
  alert("Password Not Matched");
  document.form.cpass.focus();
  return false;
 }
 
 alert("Form Submitted Successfully");
 return True;
 
}

</script>

</body>
</html>
